  EUSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: AppdInstanceRole

Outputs:
  ConsoleInstanceID:
    Description: The ConsoleAZ Instance ID
    Value: !Ref ConsoleAsg
  ControlTargetGroupArn:
    Description: ARN of the target group for Control nodes
    Value: !Ref ControlTargetGroup
  ControlInstanceID:
    Description: The Control Instance ID
    Value: !Ref ControlAsg
  EUSTargetGroupArn:
    Description: ARN of the target group for EUS nodes
    Value: !Ref EUSTargetGroup
