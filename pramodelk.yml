        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/ais-permissions-boundaries"
      Tags:
        - Key: ref_architecture
          Value: Data Node
        - Key: ref_architecture_tooling
          Value: cft
        - Key: ref_architecture_version
          Value: "2020-12-03"
        - Key: ref_architecture_instance_id
          Value: !Ref "AWS::StackName"
          
  CoordinatorASG
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
    IamInstanceProfile:
        Ref: CoordinatorInstanceProfile
      ImageId:
        Ref: ImageId
      InstanceType:
        Ref: InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: '30'
