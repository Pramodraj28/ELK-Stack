Outputs:
  DataAZ1InstanceID:
    Description: The DataAZ1 Instance ID
    Value: !Ref DataAZ1EC2Instance
    Export:
      Name: !Sub "${AWS::StackName}-az1"
  DataAZ2InstanceID:
    Description: The DataAZ2 Instance ID
    Value: !Ref DataAZ2EC2Instance
    Export:
      Name: !Sub "${AWS::StackName}-az2"
  DataAZ3InstanceID:
    Description: The DataAZ3 Instance ID
    Value: !Ref DataAZ3EC2Instance
    Export:
      Name: !Sub "${AWS::StackName}-az3"      